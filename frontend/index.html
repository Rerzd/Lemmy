<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f0f6ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#182216" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Lemmy - a personal finance tracker for income, spending and budgets." />
    <script>
      // Apply the saved or system theme before first paint, so there is no flash.
      // Mirrors src/lib/theme.ts (same storage key and values).
      ;(function () {
        var preference = 'system'
        try {
          var saved = localStorage.getItem('lemmy-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <title>Lemmy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
